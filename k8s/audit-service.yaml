apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  labels: { app.kubernetes.io/name: audit-service, app.kubernetes.io/part-of: paystream }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: audit-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: audit-service, app.kubernetes.io/part-of: paystream }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 45
      containers:
        - name: audit-service
          image: registry.example.com/paystream/audit-service:latest
          ports:
            - { name: http, containerPort: 8084 }
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: paystream-config, key: kafka-bootstrap-servers } }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: paystream-secrets, key: mongodb-uri } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  labels: { app.kubernetes.io/name: audit-service }
spec:
  selector: { app.kubernetes.io/name: audit-service }
  ports:
    - { name: http, port: 8084, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: audit-service
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: audit-service }
