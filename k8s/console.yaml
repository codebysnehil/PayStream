apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels: { app.kubernetes.io/name: console, app.kubernetes.io/part-of: paystream }
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: console }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: console, app.kubernetes.io/part-of: paystream }
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 45
      containers:
        - name: console
          image: registry.example.com/paystream/console:latest
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels: { app.kubernetes.io/name: console }
spec:
  selector: { app.kubernetes.io/name: console }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: console
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: console }
