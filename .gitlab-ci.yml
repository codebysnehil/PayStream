stages: [build, test, quality, package, scan, deploy]

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"

default:
  image: maven:3.9.9-eclipse-temurin-21
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths: [.m2/repository]

# GitLab-managed DevSecOps scanners (run in the "test" stage).
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

compile:
  stage: build
  script: mvn $MAVEN_CLI_OPTS compile

unit-and-integration-tests:
  stage: test
  script: mvn $MAVEN_CLI_OPTS verify
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"
    paths: ["**/target/site/jacoco/"]
    expire_in: 1 week

frontend-test-and-build:
  stage: test
  image: node:22-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --no-audit --no-fund
    - npx ng test --watch=false
    - npx ng build --configuration production
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 week

console-image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t $CI_REGISTRY_IMAGE/console:$CI_COMMIT_SHORT_SHA frontend
    - docker push $CI_REGISTRY_IMAGE/console:$CI_COMMIT_SHORT_SHA

sonarqube:
  stage: quality
  needs: [unit-and-integration-tests]
  rules:
    - if: $SONAR_TOKEN
  script:
    - >
      mvn $MAVEN_CLI_OPTS verify org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar
      -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true

.image-matrix: &image-matrix
  parallel:
    matrix:
      - MODULE: [payment-service, fraud-service, ledger-service, audit-service, gateway-service]

docker-image:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  <<: *image-matrix
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg MODULE=$MODULE -t $CI_REGISTRY_IMAGE/$MODULE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE/$MODULE:$CI_COMMIT_SHORT_SHA

# Container image scan. Trivy is used here; Prisma Cloud (twistcli) or Wiz CLI slot in the same way.
container-scan:
  stage: scan
  image: { name: aquasec/trivy:0.56.2, entrypoint: [""] }
  <<: *image-matrix
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed $CI_REGISTRY_IMAGE/$MODULE:$CI_COMMIT_SHORT_SHA

deploy-openshift:
  stage: deploy
  image: { name: quay.io/openshift/origin-cli:4.15, entrypoint: [""] }
  environment: { name: staging }
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  script:
    - oc login --token="$OC_TOKEN" --server="$OC_SERVER"
    - cd k8s
    # Pin every image to the one built and scanned in this pipeline.
    - for m in payment-service fraud-service ledger-service audit-service gateway-service console; do
        sed -i "s#{ name: registry.example.com/paystream/$m, newTag: latest }#{ name: registry.example.com/paystream/$m, newName: $CI_REGISTRY_IMAGE/$m, newTag: $CI_COMMIT_SHORT_SHA }#" kustomization.yaml;
      done
    - oc apply -k .
    - oc -n paystream rollout status deployment/payment-service --timeout=180s
